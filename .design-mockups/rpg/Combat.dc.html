<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c0a060; } a:hover { color: #f0e0d0; }
  </style>
</helmet>

<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #2a2418; font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; color: #302000; box-sizing: border-box;">

  <!-- ============ LA SCENE : une carte tactique du corpus, sur sa grille ============ -->
  <div style="position: absolute; inset: 0; background: #3a3020;"></div>
  <div style="position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(192,160,96,.10) 2px, transparent 2px), linear-gradient(to bottom, rgba(192,160,96,.10) 2px, transparent 2px); background-size: 72px 72px;"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 42%, transparent 40%, rgba(0,0,0,.62) 100%);"></div>
  <div style="position: absolute; left: 50%; top: 26px; transform: translateX(-50%); font-family: 'Cinzel', Georgia, serif; font-size: 12px; letter-spacing: .18em; color: rgba(240,224,208,.42);">MAP GRID · carte tactique 72 px / case</div>

  <!-- Jetons sur la carte : famille `beast`, 96 x 96, le jeton rond de table virtuelle. -->
  <div style="position: absolute; left: 292px; top: 300px; width: 96px; height: 96px;">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="45" fill="#c4ae8c" stroke="#302000" stroke-width="4"/>
      <circle cx="48" cy="48" r="39" fill="none" stroke="#c0a060" stroke-width="2.5"/>
      <path d="M14 14 L82 82 M82 14 L14 82" stroke="#907030" stroke-width="1.6" opacity=".45"/>
    </svg>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-family: 'Cinzel', Georgia, serif; font-size: 10px; letter-spacing: .1em; color: #705020; background: #e0d0b0; padding: 3px 6px; box-shadow: 0 0 0 2px #907030;">species/demi-elfe</div>
  </div>

  <div style="position: absolute; left: 588px; top: 226px; width: 96px; height: 96px;">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="45" fill="#c4ae8c" stroke="#302000" stroke-width="4"/>
      <circle cx="48" cy="48" r="39" fill="none" stroke="#907030" stroke-width="2.5"/>
      <path d="M14 14 L82 82 M82 14 L14 82" stroke="#907030" stroke-width="1.6" opacity=".45"/>
    </svg>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-family: 'Cinzel', Georgia, serif; font-size: 10px; letter-spacing: .1em; color: #705020; background: #e0d0b0; padding: 3px 6px; box-shadow: 0 0 0 2px #907030;">beast/wolf</div>
  </div>

  <!-- Le jeton designe : anneau de cire rouge, et le fleuron par-dessus. Jamais la teinte seule. -->
  <div style="position: absolute; left: 700px; top: 372px; width: 96px; height: 96px;">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="45" fill="#c4ae8c" stroke="#701010" stroke-width="5"/>
      <circle cx="48" cy="48" r="38" fill="none" stroke="#c0a060" stroke-width="2.5"/>
      <path d="M14 14 L82 82 M82 14 L14 82" stroke="#907030" stroke-width="1.6" opacity=".45"/>
    </svg>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-family: 'Cinzel', Georgia, serif; font-size: 10px; letter-spacing: .1em; color: #705020; background: #e0d0b0; padding: 3px 6px; box-shadow: 0 0 0 2px #907030;">beast/wolf</div>
    <svg width="20" height="20" viewBox="0 0 18 18" style="position: absolute; left: -20px; top: 50%; transform: translateY(-50%); color: #c0a060;"><path d="M1 3 L5 9 L1 15 L16 9 Z" fill="currentColor" stroke="#302000" stroke-width="1.2"/></svg>
  </div>

  <!-- ============ ORDRE D'INITIATIVE ============ -->
  <!-- Un bandeau de parchemin posé en haut : l'ATH garde l'identité, il ne bascule pas en verre sombre. -->
  <div style="position: absolute; left: 24px; top: 20px; display: flex; align-items: center; gap: 12px; background: #e0d0b0; box-shadow: 0 0 0 3px #302000, inset 0 0 0 3px #e0d0b0, inset 0 0 0 5px #907030; padding: 9px 14px;">
    <div style="font-family: 'Cinzel', Georgia, serif; font-size: 12px; font-weight: 700; letter-spacing: .15em; color: #705020; writing-mode: vertical-rl; transform: rotate(180deg); line-height: 1;">ORDRE D'INITIATIVE</div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="position: relative; width: 54px; height: 54px;">
        <svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="#f0e0d0" stroke="#302000" stroke-width="3"/><circle cx="27" cy="27" r="20" fill="none" stroke="#c0a060" stroke-width="2"/></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700;">18</div>
        <div style="position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font-family: 'Cinzel', Georgia, serif; font-size: 9px; letter-spacing: .1em; background: #302000; color: #f0e0d0; padding: 1px 5px; white-space: nowrap;">BRENNA</div>
      </div>
      <div style="position: relative; width: 46px; height: 46px;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="#d0c0a0" stroke="#302000" stroke-width="2.5"/></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; color: #705020;">14</div>
      </div>
      <div style="position: relative; width: 46px; height: 46px;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="#d0c0a0" stroke="#302000" stroke-width="2.5"/></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; color: #705020;">12</div>
      </div>
      <div style="position: relative; width: 46px; height: 46px;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="#d0c0a0" stroke="#302000" stroke-width="2.5"/></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; color: #705020;">9</div>
      </div>
      <div style="position: relative; width: 46px; height: 46px;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="#d0c0a0" stroke="#302000" stroke-width="2.5"/></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; color: #705020;">7</div>
      </div>
      <div style="position: relative; width: 46px; height: 46px;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="#d0c0a0" stroke="#302000" stroke-width="2.5"/></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; color: #705020;">4</div>
      </div>
    </div>
  </div>

  <!-- ============ CIBLE ============ -->
  <div style="position: absolute; right: 24px; top: 20px; width: 288px; background: #e0d0b0; box-shadow: 0 0 0 3px #302000, inset 0 0 0 3px #e0d0b0, inset 0 0 0 5px #907030; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px;">
    <div style="font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; letter-spacing: .16em; color: #705020; border-bottom: 2px solid #907030; padding-bottom: 4px;">CIBLE</div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="position: relative; width: 62px; height: 62px; flex: none;">
        <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="#c4ae8c" stroke="#701010" stroke-width="3"/><path d="M10 10 L52 52 M52 10 L10 52" stroke="#907030" stroke-width="1.4" opacity=".45"/></svg>
      </div>
      <div style="min-width: 0;">
        <div style="font-family: 'Cinzel', Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1.15;">Loup</div>
        <div style="font-size: 14px; color: #705020;">beast/wolf</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: .14em; color: #705020;">POINTS DE VIE</span>
        <span style="font-size: 19px; font-weight: 600;">8&thinsp;/&thinsp;11</span>
      </div>
      <div style="position: relative; height: 15px; background: #d0c0a0; box-shadow: 0 0 0 2px #302000, inset 0 0 0 2px #907030;">
        <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 72%; background: linear-gradient(180deg, #8a2020, #701010 55%, #400000);"></div>
      </div>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: .14em; color: #705020;">CLASSE D'ARMURE</span>
      <span style="font-size: 19px; font-weight: 600;">13</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <span style="font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: .14em; color: #705020;">ÉTATS</span>
      <span style="display: flex; align-items: center; gap: 7px; font-size: 15px; background: #f0e0d0; box-shadow: 0 0 0 2px #907030; padding: 2px 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#701010" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 16.5v.5"/></svg>
        Effrayé
      </span>
    </div>
  </div>

  <!-- ============ ETAT DU PORTEUR, en bas a gauche ============ -->
  <div style="position: absolute; left: 24px; bottom: 108px; width: 268px; background: #e0d0b0; box-shadow: 0 0 0 3px #302000, inset 0 0 0 3px #e0d0b0, inset 0 0 0 5px #907030; padding: 10px 13px; display: flex; align-items: center; gap: 12px;">
    <div style="position: relative; width: 54px; height: 66px; flex: none; background: #c4ae8c; box-shadow: 0 0 0 2px #302000;">
      <svg width="54" height="66" viewBox="0 0 54 66" style="position: absolute; inset: 0;"><path d="M0 0 L54 66 M54 0 L0 66" stroke="#907030" stroke-width="1.3" opacity=".5"/></svg>
    </div>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 16px; font-weight: 600;">Brenna</span>
        <span style="font-size: 18px; font-weight: 600;">27&thinsp;/&thinsp;32</span>
      </div>
      <div style="position: relative; height: 15px; background: #d0c0a0; box-shadow: 0 0 0 2px #302000, inset 0 0 0 2px #907030;">
        <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 84%; background: linear-gradient(180deg, #8a2020, #701010 55%, #400000);"></div>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; color: #705020;">
        <span>Classe d'armure 15</span><span>Vitesse 9 m</span>
      </div>
    </div>
  </div>

  <!-- ============ BARRE D'ACTIONS ============ -->
  <div style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 10px; background: #e0d0b0; box-shadow: 0 0 0 3px #302000, inset 0 0 0 3px #e0d0b0, inset 0 0 0 5px #907030; padding: 11px 14px;">

    <div style="position: relative; width: 68px; height: 68px; background: #f0e0d0; box-shadow: 0 0 0 2px #302000, inset 0 0 0 2px #c0a060; display: flex; align-items: center; justify-content: center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#302000" stroke-width="1.7"><path d="M4 20l3-3"/><path d="M6 18l11-11 3-3v3l-3 3-8 8z"/><path d="M15 6l3 3"/></svg>
      <span style="position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font-size: 12px; color: #302000; background: #f0e0d0; box-shadow: 0 0 0 2px #907030; padding: 1px 7px;">X</span>
      <svg width="15" height="15" viewBox="0 0 18 18" style="position: absolute; left: 50%; top: -14px; transform: translateX(-50%) rotate(90deg); color: #c0a060;"><path d="M1 3 L5 9 L1 15 L16 9 Z" fill="currentColor" stroke="#302000" stroke-width="1.2"/></svg>
    </div>

    <div style="position: relative; width: 68px; height: 68px; background: #f0e0d0; box-shadow: 0 0 0 2px #302000, inset 0 0 0 2px #907030; display: flex; align-items: center; justify-content: center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#302000" stroke-width="1.7"><path d="M12 3l8 2.5v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"/></svg>
      <span style="position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font-size: 12px; color: #302000; background: #f0e0d0; box-shadow: 0 0 0 2px #907030; padding: 1px 7px;">Y</span>
    </div>

    <div style="position: relative; width: 68px; height: 68px; background: #f0e0d0; box-shadow: 0 0 0 2px #302000, inset 0 0 0 2px #907030; display: flex; align-items: center; justify-content: center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#302000" stroke-width="1.7"><path d="M4 17c4-1 5-4 5-7"/><path d="M9 10l7-6 4 4-6 7"/><path d="M14 15l5 5"/></svg>
      <span style="position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font-size: 12px; color: #302000; background: #f0e0d0; box-shadow: 0 0 0 2px #907030; padding: 1px 7px;">B</span>
    </div>

    <div style="position: relative; width: 68px; height: 68px; background: #d0c0a0; box-shadow: inset 0 0 0 2px #907030; display: flex; align-items: center; justify-content: center;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#907030" stroke-width="1.7"><path d="M12 4v16M4 12h16"/></svg>
    </div>
    <div style="width: 68px; height: 68px; background: #d0c0a0; box-shadow: inset 0 0 0 2px #907030;"></div>
    <div style="width: 68px; height: 68px; background: #d0c0a0; box-shadow: inset 0 0 0 2px #907030;"></div>
  </div>

  <!-- ============ RAPPELS DE TOUCHES ============ -->
  <div style="position: absolute; right: 24px; bottom: 26px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; font-size: 15px; color: rgba(240,224,208,.7); letter-spacing: .05em;">
    <span style="display: flex; align-items: center; gap: 7px;"><span style="font-size: 13px; color: #302000; padding: 3px 7px; background: #f0e0d0; box-shadow: 0 0 0 2px #907030;">A</span> Valider</span>
    <span style="display: flex; align-items: center; gap: 7px;"><span style="font-size: 13px; color: #302000; padding: 3px 7px; background: #f0e0d0; box-shadow: 0 0 0 2px #907030;">LB</span><span style="font-size: 13px; color: #302000; padding: 3px 7px; background: #f0e0d0; box-shadow: 0 0 0 2px #907030;">RB</span> Changer de cible</span>
    <span style="display: flex; align-items: center; gap: 7px;"><span style="font-size: 13px; color: #302000; padding: 3px 7px; background: #f0e0d0; box-shadow: 0 0 0 2px #907030;">ÉCHAP</span> Revenir</span>
  </div>

</div>
</x-dc>
</body>
</html>
