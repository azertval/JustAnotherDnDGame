name: Temporary CMake Gate

on:
  push:
    branches:
      - fix/qt-designer-6.8.7-compatibility

permissions:
  contents: read

jobs:
  configure-build-test:
    runs-on: windows-2022
    env:
      QT_VERSION: '6.11.2'
      AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate QML / Design Studio boundary
        shell: pwsh
        run: python scripts/check_qml_designer_compat.py

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools qtcanvaspainter
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure, build and test with MSVC environment
        shell: cmd
        run: |
          rem VsDevCmd.bat sets INCLUDE/LIB/PATH and other MSVC variables required by cl.exe.
          rem Keep configure, build and test in this same cmd process so those variables are preserved.
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          where cl
          cl
          cmake --preset ninja
          if errorlevel 1 exit /b %errorlevel%
          cmake --build --preset ninja
          if errorlevel 1 exit /b %errorlevel%
          ctest --preset ninja
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
