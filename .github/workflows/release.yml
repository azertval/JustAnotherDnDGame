name: Release

# Deux déclencheurs distincts, deux jobs indépendants :
# - push sur main  -> reconstruit la release "roulante" debug-latest (préversion Debug autonome,
#   toujours à jour avec le dernier commit intégré).
# - tag "vX.Y.Z"   -> publie une release versionnée (non préversion), avec les exécutables Debug
#   ET Release, chacun autonome.
#
# Depuis le LOT-38, l'unique application `JustAnotherDnDGame` est une app **Qt** : le job installe Qt
# (comme la CI), construit avec le **runtime MSVC dynamique** (les DLL Qt officielles sont en /MD ;
# un CRT statique provoquerait des incohérences d'allocation), et empaquette **tout le dossier de
# l'exécutable** — `windeployqt` (POST_BUILD, Source/HMI/CMakeLists.txt) y a déposé les DLL Qt, le
# plugin de plateforme (`platforms/`) et le runtime du compilateur, à côté des dossiers d'assets
# `Levels/` et `Localization/`. Aucune installation (Qt, VC++ redist) requise côté utilisateur.
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

env:
  # Version de Qt épinglée (EX-BUILD-010), identique à `QT_VERSION_MINIMUM` dans
  # `Source/HMI/CMakeLists.txt` et à `env.QT_VERSION` de `ci.yml` — vérifié automatiquement par
  # `scripts/check_qt_version_pin.py` (job lint-exigences de ci.yml) pour que les trois écritures
  # ne divergent jamais silencieusement (LOT-66 TACHE-01).
  QT_VERSION: '6.11.2'
  # aqtinstall publie sur PyPI (3.3.0) ne sait PAS installer Qt >= 6.11 : Qt a change la
  # disposition de son depot (`qt6_6112/qt6_6112_msvc2022_64/`, un sous-dossier par architecture,
  # au lieu de `qt6_6103/qt6_6103/`), et 3.3.0 code en dur l'ancienne. Le correctif amont est
  # merge (miurahr/aqtinstall PR #1000, issues #959/#1007) mais pas encore publie. `aqtsource`
  # (entree de install-qt-action, prioritaire sur `aqtversion`) permet de pointer le depot git ;
  # le SHA est EPINGLE et non `@master`, sinon le provisionnement deriverait silencieusement, ce
  # que `EX-BUILD-010` / `EX-NFR-031` interdisent. A REMPLACER par `aqtversion: '==3.3.1'` des
  # qu'aqtinstall 3.3.1 parait sur PyPI -- cette URL git n'a pas vocation a rester.
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

jobs:
  rolling-debug:
    if: github.ref_type == 'branch'
    # Épinglé : windows-latest (image 2025) ne fournit pas le générateur VS 2022.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Qt est nécessaire pour construire l'application (cf. ci.yml).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # qtmultimedia : module audio (LOT-60) -- Qt6::Multimedia (QSoundEffect) est un composant
          # additionnel de l'installation Qt, pas une dependance tierce separee.
          # qtshadertools : fournit `qsb`, le compilateur de shaders exige par le rendu QRhi
          # (LOT-69 TACHE-02). qtcanvaspainter : peinture 2D acceleree (LOT-69), nouveau en 6.11.
          # Un nom de module inconnu fait echouer aqt : ces trois lignes valent donc verification
          # que le provisionnement de 6.11.2 fournit bien ce dont les taches suivantes dependent.
          modules: qtmultimedia qtshadertools qtcanvaspainter
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (Debug autonome, sans tests)
        run: >
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build build-release --config Debug

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          # Tout le dossier de l'exécutable : JustAnotherDnDGame.exe, DLL Qt + platforms/ (windeployqt),
          # runtime du compilateur, et les assets Levels/ Localization/ (POST_BUILD CMake).
          Copy-Item build-release/bin/Debug/* package/ -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath JustAnotherDnDGame-debug.zip -Force

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recrée une release « roulante » pointant sur le dernier main.
          gh release delete debug-latest --yes --cleanup-tag 2>$null
          gh release create debug-latest JustAnotherDnDGame-debug.zip `
            --title "JustAnotherDnDGame — Debug (dernier main)" `
            --notes "Build Debug automatique du dernier commit sur main. Décompresser et lancer JustAnotherDnDGame.exe." `
            --prerelease

  versioned-release:
    if: github.ref_type == 'tag'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # qtmultimedia : module audio (LOT-60) -- Qt6::Multimedia (QSoundEffect) est un composant
          # additionnel de l'installation Qt, pas une dependance tierce separee.
          # qtshadertools : fournit `qsb`, le compilateur de shaders exige par le rendu QRhi
          # (LOT-69 TACHE-02). qtcanvaspainter : peinture 2D acceleree (LOT-69), nouveau en 6.11.
          # Un nom de module inconnu fait echouer aqt : ces trois lignes valent donc verification
          # que le provisionnement de 6.11.2 fournit bien ce dont les taches suivantes dependent.
          modules: qtmultimedia qtshadertools qtcanvaspainter
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (Debug autonome, sans tests)
        run: >
          cmake -S . -B build-debug -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Debug)
        run: cmake --build build-debug --config Debug

      - name: Configure (Release autonome, sans tests)
        run: >
          cmake -S . -B build-prod -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Release)
        run: cmake --build build-prod --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-debug, package-release | Out-Null

          # Tout le dossier de l'exécutable (exe + DLL Qt + platforms/ + runtime + assets).
          Copy-Item build-debug/bin/Debug/* package-debug/ -Recurse -Force
          Compress-Archive -Path package-debug/* -DestinationPath "JustAnotherDnDGame-${{ github.ref_name }}-debug.zip" -Force

          Copy-Item build-prod/bin/Release/* package-release/ -Recurse -Force
          Compress-Archive -Path package-release/* -DestinationPath "JustAnotherDnDGame-${{ github.ref_name }}-release.zip" -Force

      # Les notes viennent du CHANGELOG plutôt que de `--generate-notes`, qui ne produit qu'une
      # liste brute de messages de commit — illisible pour le non-développeur à qui la release
      # versionnée est destinée. Le script échoue si la section de la version manque : mieux vaut
      # interrompre le workflow qu'ouvrir une release aux notes vides, qui ne se corrige pas
      # proprement. Cette étape est donc volontairement AVANT la publication.
      - name: Notes de release depuis le CHANGELOG
        run: python scripts/extract_release_notes.py "${{ github.ref_name }}" -o release-notes.md

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "JustAnotherDnDGame-${{ github.ref_name }}-debug.zip" `
            "JustAnotherDnDGame-${{ github.ref_name }}-release.zip" `
            --title "${{ github.ref_name }}" `
            --notes-file release-notes.md
