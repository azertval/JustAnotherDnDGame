name: Documentation

# À chaque intégration sur main, génère la Doxygen et la publie sur la branche gh-pages.
on:
  push:
    branches: [ main ]
  # Relance manuelle sans commit vide ; le job ne publie que depuis main (voir `if`).
  workflow_dispatch:

# Deux merges rapprochés : seul le site du dernier compte, le déploiement précédent est annulé.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Même version épinglée que le job `docs` de ci.yml : le site publié doit être
  # généré par le binaire qui a validé la PR, sinon une doc verte en CI pourrait
  # échouer au déploiement. Voir le commentaire de ci.yml.
  DOXYGEN_VERSION: 1.16.1

jobs:
  deploy-docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Seul ce job écrit (branche gh-pages).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          set -euo pipefail
          tag="Release_${DOXYGEN_VERSION//./_}"
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          # Extrait hors du dépôt (RUNNER_TEMP) : le workspace reste propre, et rien
          # d'étranger ne peut se retrouver dans le dossier publié sur gh-pages.
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/doxygen/doxygen/releases/download/${tag}/${archive}"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check Doxygen version
        run: doxygen --version

      - name: Generate documentation
        run: python3 scripts/build_docs.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Documentation/generated/html
          publish_branch: gh-pages
